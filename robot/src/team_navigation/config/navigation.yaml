/**:
  ros__parameters:
    requested_forward_speed_m_s: 0.6
    minimum_forward_speed_m_s: 0.25
    fork_forward_speed_m_s: 0.35
    slow_offset_fraction: 0.35
    smoothing_alpha: 0.35
    max_image_age_s: 0.20
    steering_kp: 1.2
    steering_kd: 0.09
    max_yaw_rate_rad_s: 1.2
    # Calibrated from the team's UC684 clips under the lab lighting.
    yellow_hsv_lower: [20, 100, 100]
    yellow_hsv_upper: [34, 255, 255]
    orange_hsv_lower: [4, 150, 80]
    orange_hsv_upper: [19, 255, 255]
    orange_guard_kernel_px: 15
    blue_hsv_lower: [98, 100, 60]
    blue_hsv_upper: [122, 255, 255]
    blue_stop_fraction: 0.50
    blue_corridor_half_width_fraction: 0.15
    blue_roi_top_fraction: 0.60
    blue_roi_bottom_fraction: 0.90
    # On blue, turn in place and accept the first clear yellow path after a
    # small initial turn. Stop if one commanded revolution finds nothing.
    scan_enabled: true
    scan_yaw_rate_rad_s: 0.60
    scan_anticlockwise: true
    scan_yellow_min_fraction: 0.005
    scan_min_turn_rad: 0.35
    fork_min_fraction: 0.015
    fork_min_separation_fraction: 0.20
